name: LineLess Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Static checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate CloudFormation YAML syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const source = fs.readFileSync('infrastructure/lineless.yaml', 'utf8');
          // js-yaml does not understand CloudFormation's intrinsic !Ref/!Sub/!If
          // tags by default. Strip only the tag markers for a syntax-level parse;
          // AWS CloudFormation remains the semantic validator during deployment.
          yaml.load(source.replace(/!([A-Za-z][A-Za-z0-9]*)\b/g, ''));
          console.log('CloudFormation YAML syntax parsed successfully');
          NODE
